<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600"><title>六天收束：从读懂矩阵，到选择矩阵</title><desc>六个阶段：空间变换、秩、投影、特征分解、凸二次优化、半正定规划。</desc><rect width="1000" height="600" fill="#101d2b"/><g font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif"><text x="25" y="44" fill="#e6edf4" font-size="28">六天收束：从读懂矩阵，到选择矩阵</text><rect x="30" y="100" width="455" height="125" rx="12" fill="#163044"/><text x="48" y="135" fill="#f8d174" font-size="24">01  空间变换</text><text x="48" y="172" fill="#e6edf4" font-size="22">列记录基本方向的去向</text><text x="48" y="205" fill="#a7bacb" font-size="19">输入怎样组合，输出就怎样组合</text><rect x="515" y="100" width="455" height="125" rx="12" fill="#163044"/><text x="533" y="135" fill="#f8d174" font-size="24">02  秩与零空间</text><text x="533" y="172" fill="#e6edf4" font-size="22">哪些区别被保留或压掉</text><text x="533" y="205" fill="#a7bacb" font-size="19">秩看输出；零空间找丢失方向</text><rect x="30" y="245" width="455" height="125" rx="12" fill="#163044"/><text x="48" y="280" fill="#f8d174" font-size="24">03  投影与最小二乘</text><text x="48" y="317" fill="#e6edf4" font-size="22">在可达范围内寻找最近点</text><text x="48" y="350" fill="#a7bacb" font-size="19">先找最佳预测，再区分输入解</text><rect x="515" y="245" width="455" height="125" rx="12" fill="#163044"/><text x="533" y="280" fill="#f8d174" font-size="24">04  特征分解与 SVD</text><text x="533" y="317" fill="#e6edf4" font-size="22">沿特殊方向分开理解</text><text x="533" y="350" fill="#a7bacb" font-size="19">倍数、方差和压缩各有含义</text><rect x="30" y="390" width="455" height="125" rx="12" fill="#163044"/><text x="48" y="425" fill="#f8d174" font-size="24">05  二次型与凸优化</text><text x="48" y="462" fill="#e6edf4" font-size="22">给每个方向检查曲率</text><text x="48" y="495" fill="#a7bacb" font-size="19">凸性与可行方向共同决定最优</text><rect x="515" y="390" width="455" height="125" rx="12" fill="#163044"/><text x="533" y="425" fill="#f8d174" font-size="24">06  半正定规划</text><text x="533" y="462" fill="#e6edf4" font-size="22">让矩阵本身成为未知量</text><text x="533" y="495" fill="#a7bacb" font-size="19">选择目标，写清约束，核对结果</text><text x="30" y="575" fill="#a7bacb" font-size="21">共同问题：未知量是什么？哪些方向重要？哪些条件必须满足？怎样检验？</text></g></svg>