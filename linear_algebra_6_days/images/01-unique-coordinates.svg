<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="570" viewBox="0 0 1100 570"><title>坐标唯一性：系数相加为零，不等于向量相加为零</title><desc>左图：两个独立方向不能用一加一减抵消。右图：重复的方向才可以。</desc><rect width="1100" height="570" fill="#101d2b"/><g font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif"><text x="30" y="42" fill="#e6edf4" font-size="27">坐标唯一性：系数相加为零，不等于向量相加为零</text><text x="30" y="78" fill="#a7bacb" font-size="18">左图：两个独立方向不能用一加一减抵消。右图：重复的方向才可以。</text><text x="45" y="125" fill="#e6edf4" font-size="21">独立方向：b₁ = (1,0)，b₂ = (0,1)</text><text x="610" y="125" fill="#e6edf4" font-size="21">重复方向：b₁ = b₂ = (1,0)</text><line x1="65" y1="380" x2="65" y2="200" stroke="#293c50" stroke-width="1" stroke-dasharray=""/><line x1="125" y1="380" x2="125" y2="200" stroke="#293c50" stroke-width="1" stroke-dasharray=""/><line x1="185" y1="380" x2="185" y2="200" stroke="#293c50" stroke-width="1" stroke-dasharray=""/><line x1="245" y1="380" x2="245" y2="200" stroke="#293c50" stroke-width="1" stroke-dasharray=""/><line x1="305" y1="380" x2="305" y2="200" stroke="#293c50" stroke-width="1" stroke-dasharray=""/><line x1="65" y1="380" x2="353.0" y2="380" stroke="#293c50" stroke-width="1" stroke-dasharray=""/><line x1="65" y1="320" x2="353.0" y2="320" stroke="#293c50" stroke-width="1" stroke-dasharray=""/><line x1="65" y1="260" x2="353.0" y2="260" stroke="#293c50" stroke-width="1" stroke-dasharray=""/><line x1="65" y1="200" x2="353.0" y2="200" stroke="#293c50" stroke-width="1" stroke-dasharray=""/><line x1="65" y1="380" x2="353.0" y2="380" stroke="#a7bacb" stroke-width="1" stroke-dasharray=""/><polygon points="353.0,380 341.94726807196537,384.6730201077038 341.94726807196537,375.3269798922962" fill="#a7bacb"/><line x1="65" y1="380" x2="65" y2="200" stroke="#a7bacb" stroke-width="1" stroke-dasharray=""/><polygon points="65,200 69.6730201077038,211.05273192803463 60.326979892296194,211.05273192803463" fill="#a7bacb"/><text x="45" y="405" fill="#a7bacb" font-size="17">0</text><line x1="65" y1="380" x2="245" y2="380" stroke="#ff8d83" stroke-width="3" stroke-dasharray=""/><polygon points="245,380 233.94726807196537,384.6730201077038 233.94726807196537,375.3269798922962" fill="#ff8d83"/><line x1="245" y1="380" x2="245" y2="260" stroke="#71c9ff" stroke-width="3" stroke-dasharray=""/><polygon points="245,260 249.6730201077038,271.05273192803463 240.3269798922962,271.05273192803463" fill="#71c9ff"/><text x="210" y="240" fill="#f8d174" font-size="21">(3,2)</text><line x1="245" y1="260" x2="305" y2="260" stroke="#ff8d83" stroke-width="3" stroke-dasharray=""/><polygon points="305,260 293.94726807196537,264.6730201077038 293.94726807196537,255.3269798922962" fill="#ff8d83"/><line x1="305" y1="260" x2="305" y2="320" stroke="#71c9ff" stroke-width="3" stroke-dasharray=""/><polygon points="305,320 300.3269798922962,308.94726807196537 309.6730201077038,308.94726807196537" fill="#71c9ff"/><text x="320" y="325" fill="#f8d174" font-size="21">(4,1)</text><text x="90" y="420" fill="#e6edf4" font-size="19">多一份 b₁，少一份 b₂：终点变了</text><line x1="650" y1="260" x2="850" y2="260" stroke="#ff8d83" stroke-width="3" stroke-dasharray=""/><polygon points="850,260 838.9472680719654,264.6730201077038 838.9472680719654,255.3269798922962" fill="#ff8d83"/><text x="710" y="235" fill="#ff8d83" font-size="21">+b₁</text><line x1="850" y1="300" x2="650" y2="300" stroke="#71c9ff" stroke-width="3" stroke-dasharray=""/><polygon points="650,300 661.0527319280346,295.3269798922962 661.0527319280346,304.6730201077038" fill="#71c9ff"/><text x="710" y="335" fill="#71c9ff" font-size="21">−b₂</text><text x="635" y="380" fill="#e6edf4" font-size="19">同方向、等长度，反向后才抵消</text><text x="45" y="475" fill="#f8d174" font-size="23">1b₁ − 1b₂ = (1,−1) ≠ 零向量</text><text x="610" y="475" fill="#f8d174" font-size="23">1b₁ − 1b₂ = 零向量</text><text x="30" y="535" fill="#a7bacb" font-size="21">基要求线性无关：要组合出零向量，每一个系数都必须为零。</text></g></svg>