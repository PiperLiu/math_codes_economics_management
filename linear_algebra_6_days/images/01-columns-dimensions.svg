<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="670" viewBox="0 0 1100 670"><title>三行两列：两种输入基本动作，各有三个输出坐标</title><desc>M 的第一列是第一支输入基向量的去向，第二列是第二支的去向。</desc><rect width="1100" height="670" fill="#101d2b"/><g font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif"><text x="30" y="42" fill="#e6edf4" font-size="27">三行两列：两种输入基本动作，各有三个输出坐标</text><text x="30" y="78" fill="#a7bacb" font-size="18">M 的第一列是第一支输入基向量的去向，第二列是第二支的去向。</text><line x1="70" y1="325" x2="70" y2="175" stroke="#293c50" stroke-width="1" stroke-dasharray=""/><line x1="145" y1="325" x2="145" y2="175" stroke="#293c50" stroke-width="1" stroke-dasharray=""/><line x1="220" y1="325" x2="220" y2="175" stroke="#293c50" stroke-width="1" stroke-dasharray=""/><line x1="70" y1="325" x2="220" y2="325" stroke="#293c50" stroke-width="1" stroke-dasharray=""/><line x1="70" y1="250" x2="220" y2="250" stroke="#293c50" stroke-width="1" stroke-dasharray=""/><line x1="70" y1="175" x2="220" y2="175" stroke="#293c50" stroke-width="1" stroke-dasharray=""/><line x1="70" y1="325" x2="220" y2="325" stroke="#a7bacb" stroke-width="1" stroke-dasharray=""/><polygon points="220,325 208.94726807196537,329.6730201077038 208.94726807196537,320.3269798922962" fill="#a7bacb"/><line x1="70" y1="325" x2="70" y2="175" stroke="#a7bacb" stroke-width="1" stroke-dasharray=""/><polygon points="70,175 74.6730201077038,186.05273192803463 65.3269798922962,186.05273192803463" fill="#a7bacb"/><text x="50" y="350" fill="#a7bacb" font-size="17">0</text><text x="45" y="125" fill="#e6edf4" font-size="21">二维输入：两个坐标</text><line x1="70" y1="325" x2="145" y2="325" stroke="#ff8d83" stroke-width="3" stroke-dasharray=""/><polygon points="145,325 133.94726807196537,329.6730201077038 133.94726807196537,320.3269798922962" fill="#ff8d83"/><line x1="70" y1="325" x2="70" y2="250" stroke="#71c9ff" stroke-width="3" stroke-dasharray=""/><polygon points="70,250 74.6730201077038,261.05273192803463 65.3269798922962,261.05273192803463" fill="#71c9ff"/><text x="145" y="350" fill="#ff8d83" font-size="21">e₁</text><text x="85" y="245" fill="#71c9ff" font-size="21">e₂</text><text x="350" y="145" fill="#e6edf4" font-size="21">M：3 行 × 2 列</text><text x="330" y="260" fill="#e6edf4" font-size="26">M =</text><rect x="404" y="183" width="60" height="156" rx="12" fill="#ff8d83" opacity=".13"/><text x="420" y="218" fill="#ff8d83" font-size="28">1</text><text x="420" y="266" fill="#ff8d83" font-size="28">0</text><text x="420" y="314" fill="#ff8d83" font-size="28">1</text><rect x="479" y="183" width="60" height="156" rx="12" fill="#71c9ff" opacity=".13"/><text x="495" y="218" fill="#71c9ff" font-size="28">0</text><text x="495" y="266" fill="#71c9ff" font-size="28">1</text><text x="495" y="314" fill="#71c9ff" font-size="28">1</text><text x="415" y="372" fill="#ff8d83" font-size="17">第 1 列</text><text x="493" y="372" fill="#71c9ff" font-size="17">第 2 列</text><line x1="265" y1="255" x2="320" y2="255" stroke="#a7bacb" stroke-width="3" stroke-dasharray=""/><polygon points="320,255 308.94726807196537,259.6730201077038 308.94726807196537,250.3269798922962" fill="#a7bacb"/><line x1="560" y1="255" x2="630" y2="255" stroke="#a7bacb" stroke-width="3" stroke-dasharray=""/><polygon points="630,255 618.9472680719654,259.6730201077038 618.9472680719654,250.3269798922962" fill="#a7bacb"/><text x="710" y="125" fill="#e6edf4" font-size="21">三维输出：每列三个坐标</text><line x1="820" y1="370" x2="982.0" y2="316.0" stroke="#a7bacb" stroke-width="1" stroke-dasharray=""/><polygon points="982.0,316.0 972.9921965312549,323.92839685361815 970.036719112833,315.0619645983526" fill="#a7bacb"/><text x="987.0" y="316.0" fill="#a7bacb" font-size="18">x</text><line x1="820" y1="370" x2="703.0" y2="307.0" stroke="#a7bacb" stroke-width="1" stroke-dasharray=""/><polygon points="703.0,307.0 714.947089043923,308.1256390969463 710.5161330317202,316.35455740532313" fill="#a7bacb"/><text x="708.0" y="307.0" fill="#a7bacb" font-size="18">y</text><line x1="820" y1="370" x2="820" y2="190.0" stroke="#a7bacb" stroke-width="1" stroke-dasharray=""/><polygon points="820,190.0 824.6730201077038,201.05273192803463 815.3269798922962,201.05273192803463" fill="#a7bacb"/><text x="825" y="190.0" fill="#a7bacb" font-size="18">z</text><line x1="820" y1="370" x2="910" y2="240" stroke="#ff8d83" stroke-width="3" stroke-dasharray=""/><polygon points="910,240 907.5507953371748,251.74739956414163 899.8665540492779,246.42754021098227" fill="#ff8d83"/><line x1="820" y1="370" x2="755" y2="235" stroke="#71c9ff" stroke-width="3" stroke-dasharray=""/><polygon points="755,235 764.0052466603503,242.9313008129972 755.5844488206324,246.98575903212063" fill="#71c9ff"/><text x="920" y="240" fill="#ff8d83" font-size="19">(1,0,1)</text><text x="650" y="240" fill="#71c9ff" font-size="19">(0,1,1)</text><text x="35" y="470" fill="#e6edf4" font-size="23">第一列：M e₁ = (1,0,1)；第二列：M e₂ = (0,1,1)。</text><text x="35" y="520" fill="#e6edf4" font-size="23">输入 (2,1)：取两份第一列，加一份第二列。</text><text x="35" y="565" fill="#f8d174" font-size="25">M (2,1) = 2(1,0,1) + 1(0,1,1) = (2,1,3)</text><text x="35" y="630" fill="#a7bacb" font-size="19">右侧采用二维平行投影展示三维箭头；图中长度与夹角仅作示意。</text></g></svg>