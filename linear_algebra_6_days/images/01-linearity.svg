<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="610" viewBox="0 0 1100 610"><title>线性：两条计算路线，到达同一个终点</title><desc>例：T(x,y) = (2x+y,y)。红色第一段，蓝色第二段，黄色表示总位移。</desc><rect width="1100" height="610" fill="#101d2b"/><g font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif"><text x="30" y="42" fill="#e6edf4" font-size="27">线性：两条计算路线，到达同一个终点</text><text x="30" y="78" fill="#a7bacb" font-size="18">例：T(x,y) = (2x+y,y)。红色第一段，蓝色第二段，黄色表示总位移。</text><line x1="80" y1="345" x2="80" y2="182.5" stroke="#293c50" stroke-width="1" stroke-dasharray=""/><line x1="145" y1="345" x2="145" y2="182.5" stroke="#293c50" stroke-width="1" stroke-dasharray=""/><line x1="210" y1="345" x2="210" y2="182.5" stroke="#293c50" stroke-width="1" stroke-dasharray=""/><line x1="80" y1="345" x2="242.5" y2="345" stroke="#293c50" stroke-width="1" stroke-dasharray=""/><line x1="80" y1="280" x2="242.5" y2="280" stroke="#293c50" stroke-width="1" stroke-dasharray=""/><line x1="80" y1="215" x2="242.5" y2="215" stroke="#293c50" stroke-width="1" stroke-dasharray=""/><line x1="80" y1="345" x2="242.5" y2="345" stroke="#a7bacb" stroke-width="1" stroke-dasharray=""/><polygon points="242.5,345 231.44726807196537,349.6730201077038 231.44726807196537,340.3269798922962" fill="#a7bacb"/><line x1="80" y1="345" x2="80" y2="182.5" stroke="#a7bacb" stroke-width="1" stroke-dasharray=""/><polygon points="80,182.5 84.6730201077038,193.55273192803463 75.3269798922962,193.55273192803463" fill="#a7bacb"/><text x="60" y="370" fill="#a7bacb" font-size="17">0</text><text x="55" y="130" fill="#e6edf4" font-size="21">原空间：u + v = (1,1)</text><line x1="80" y1="345" x2="145" y2="345" stroke="#ff8d83" stroke-width="3" stroke-dasharray=""/><polygon points="145,345 133.94726807196537,349.6730201077038 133.94726807196537,340.3269798922962" fill="#ff8d83"/><line x1="145" y1="345" x2="145" y2="280" stroke="#71c9ff" stroke-width="3" stroke-dasharray=""/><polygon points="145,280 149.6730201077038,291.05273192803463 140.3269798922962,291.05273192803463" fill="#71c9ff"/><line x1="80" y1="345" x2="145" y2="280" stroke="#f8d174" stroke-width="3" stroke-dasharray=""/><polygon points="145,280 140.4888625098281,291.1197859037288 133.8802140962712,284.5111374901719" fill="#f8d174"/><text x="100" y="375" fill="#ff8d83" font-size="18">u = (1,0)</text><text x="155" y="270" fill="#71c9ff" font-size="18">v = (0,1)</text><line x1="650" y1="345" x2="650" y2="165" stroke="#293c50" stroke-width="1" stroke-dasharray=""/><line x1="740" y1="345" x2="740" y2="165" stroke="#293c50" stroke-width="1" stroke-dasharray=""/><line x1="830" y1="345" x2="830" y2="165" stroke="#293c50" stroke-width="1" stroke-dasharray=""/><line x1="920" y1="345" x2="920" y2="165" stroke="#293c50" stroke-width="1" stroke-dasharray=""/><line x1="1010" y1="345" x2="1010" y2="165" stroke="#293c50" stroke-width="1" stroke-dasharray=""/><line x1="650" y1="345" x2="1010" y2="345" stroke="#293c50" stroke-width="1" stroke-dasharray=""/><line x1="650" y1="255" x2="1010" y2="255" stroke="#293c50" stroke-width="1" stroke-dasharray=""/><line x1="650" y1="165" x2="1010" y2="165" stroke="#293c50" stroke-width="1" stroke-dasharray=""/><line x1="650" y1="345" x2="1010" y2="345" stroke="#a7bacb" stroke-width="1" stroke-dasharray=""/><polygon points="1010,345 998.9472680719654,349.6730201077038 998.9472680719654,340.3269798922962" fill="#a7bacb"/><line x1="650" y1="345" x2="650" y2="165" stroke="#a7bacb" stroke-width="1" stroke-dasharray=""/><polygon points="650,165 654.6730201077038,176.05273192803463 645.3269798922962,176.05273192803463" fill="#a7bacb"/><text x="630" y="370" fill="#a7bacb" font-size="17">0</text><text x="630" y="130" fill="#e6edf4" font-size="21">变换后：T(u) + T(v) = (3,1)</text><line x1="650" y1="345" x2="830" y2="345" stroke="#ff8d83" stroke-width="3" stroke-dasharray=""/><polygon points="830,345 818.9472680719654,349.6730201077038 818.9472680719654,340.3269798922962" fill="#ff8d83"/><line x1="830" y1="345" x2="920" y2="255" stroke="#71c9ff" stroke-width="3" stroke-dasharray=""/><polygon points="920,255 915.4888625098281,266.1197859037288 908.8802140962712,259.5111374901719" fill="#71c9ff"/><line x1="650" y1="345" x2="920" y2="255" stroke="#f8d174" stroke-width="3" stroke-dasharray=""/><polygon points="920,255 910.9921965312549,262.92839685361815 908.036719112833,254.06196459835255" fill="#f8d174"/><text x="690" y="375" fill="#ff8d83" font-size="18">T(u) = (2,0)</text><text x="885" y="240" fill="#71c9ff" font-size="18">T(v) = (1,1)</text><line x1="340" y1="255" x2="595" y2="255" stroke="#a7bacb" stroke-width="3" stroke-dasharray=""/><polygon points="595,255 583.9472680719654,259.6730201077038 583.9472680719654,250.3269798922962" fill="#a7bacb"/><text x="350" y="225" fill="#a7bacb" font-size="18">把整个位移变换 T</text><text x="40" y="450" fill="#e6edf4" font-size="22">路线一：先相加，再变换</text><text x="390" y="450" fill="#f8d174" font-size="22">T(u + v) = T(1,1) = (3,1)</text><text x="40" y="495" fill="#e6edf4" font-size="22">路线二：先分别变换，再相加</text><text x="390" y="495" fill="#f8d174" font-size="22">T(u) + T(v) = (2,0) + (1,1) = (3,1)</text><text x="40" y="565" fill="#a7bacb" font-size="21">配方保持不变；箭头的长度、夹角和图形的面积可以改变。</text></g></svg>