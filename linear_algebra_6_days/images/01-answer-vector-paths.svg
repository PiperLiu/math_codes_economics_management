1="390" x2="1105" y2="390" stroke="#293c50" stroke-width="1"/><line x1="855" y1="340" x2="1105" y2="340" stroke="#293c50" stroke-width="1"/><line x1="855" y1="290" x2="1105" y2="290" stroke="#293c50" stroke-width="1"/><line x1="855" y1="240" x2="1105" y2="240" stroke="#293c50" stroke-width="1"/><line x1="855" y1="190" x2="1105" y2="190" stroke="#293c50" stroke-width="1"/><line x1="855" y1="140" x2="1105" y2="140" stroke="#293c50" stroke-width="1"/><line x1="855" y1="340" x2="1115.0" y2="340" stroke="#a7bacb" stroke-width="1"/><polygon points="1115.0,340 1105.9955289764732,344.3496553411123 1105.9955289764732,335.6503446588877" fill="#a7bacb"/><line x1="955" y1="390" x2="955" y2="130.0" stroke="#a7bacb" stroke-width="1"/><polygon points="955,130.0 959.3496553411123,139.00447102352678 950.6503446588877,139.00447102352678" fill="#a7bacb"/><text x="937" y="362" fill="#a7bacb" font-size="16">0</text><text x="1118" y="345" fill="#a7bacb" font-size="16">x</text><text x="964" y="130" fill="#a7bacb" font-size="16">y</text><text x="810" y="114" fill="#e6edf4" font-size="19">第 4 题：先 R，后 S</text><line x1="955" y1="340" x2="1005" y2="290" stroke="#71c9ff" stroke-width="3"/><polygon points="1005,290 1001.7085482657913,299.4427933092583 995.5572066907416,293.29145173420875" fill="#71c9ff"/><line x1="955" y1="340" x2="905" y2="290" stroke="#ff8d83" stroke-width="3"/><polygon points="905,290 914.4427933092584,293.29145173420875 908.2914517342087,299.4427933092583" fill="#ff8d83"/><line x1="955" y1="340" x2="855" y2="290" stroke="#f8d174" stroke-width="3"/><polygon points="855,290 864.9990687282976,290.13647185343774 861.1086187197287,297.91737187057544" fill="#f8d174"/><text x="1010" y="285" fill="#71c9ff" font-size="18">(1,1)</text><text x="909" y="278" fill="#ff8d83" font-size="18">(-1, 1)</text><text x="819" y="258" fill="#f8d174" font-size="18">(-2, 1)</text><text x="810" y="439" fill="#a7bacb" font-size="18">蓝：原向量；红：第一步后</text><text x="810" y="473" fill="#f8d174" font-size="19"