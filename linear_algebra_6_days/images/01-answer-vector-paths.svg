<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="590" viewBox="0 0 1140 590"><title>第一题列向量组合与第四题操作顺序</title><desc>左侧从原点走两份第一列到 (2,2)，再走一份第二列到 (1,3)。中间先拉伸再旋转，终点为 (-1,2)；右侧先旋转再拉伸，终点为 (-2,1)。所有网格单位均为一。</desc><rect width="1140" height="590" fill="#101d2b"/><g font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif"><text x="30" y="42" fill="#e6edf4" font-size="27">参考答案：列向量的组合与操作顺序</text><text x="30" y="77" fill="#a7bacb" font-size="20">三幅图均使用固定标准坐标系，每格 1 个单位。</text><line x1="50" y1="390" x2="50" y2="140" stroke="#293c50" stroke-width="1"/><line x1="100" y1="390" x2="100" y2="140" stroke="#293c50" stroke-width="1"/><line x1="150" y1="390" x2="150" y2="140" stroke="#293c50" stroke-width="1"/><line x1="200" y1="390" x2="200" y2="140" stroke="#293c50" stroke-width="1"/><line x1="250" y1="390" x2="250" y2="140" stroke="#293c50" stroke-width="1"/><line x1="300" y1="390" x2="300" y2="140" stroke="#293c50" stroke-width="1"/><line x1="50" y1="390" x2="300" y2="390" stroke="#293c50" stroke-width="1"/><line x1="50" y1="340" x2="300" y2="340" stroke="#293c50" stroke-width="1"/><line x1="50" y1="290" x2="300" y2="290" stroke="#293c50" stroke-width="1"/><line x1="50" y1="240" x2="300" y2="240" stroke="#293c50" stroke-width="1"/><line x1="50" y1="190" x2="300" y2="190" stroke="#293c50" stroke-width="1"/><line x1="50" y1="140" x2="300" y2="140" stroke="#293c50" stroke-width="1"/><line x1="50" y1="340" x2="310.0" y2="340" stroke="#a7bacb" stroke-width="1"/><polygon points="310.0,340 300.9955289764732,344.3496553411123 300.9955289764732,335.6503446588877" fill="#a7bacb"/><line x1="150" y1="390" x2="150" y2="130.0" stroke="#a7bacb" stroke-width="1"/><polygon points="150,130.0 154.3496553411123,139.00447102352678 145.6503446588877,139.00447102352678" fill="#a7bacb"/><text x="132" y="362" fill="#a7bacb" font-size="16">0</text><text x="313" y="345" fill="#a7bacb" font-size="16">x</text><text x="159" y="130" fill="#a7bacb" font-size="16">y</text><text x="30" y="114" fill="#e6