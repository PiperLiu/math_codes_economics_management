<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520"><title>三个非零列，可以只张成一个平面</title><desc>主线矩阵 A 的三列：a₁ = (1,0,0)，a₂ = (0,1,0)，a₃ = (1,1,0)。</desc><rect width="1100" height="520" fill="#101d2b"/><g font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif"><text x="30" y="42" fill="#e6edf4" font-size="28">三个非零列，可以只张成一个平面</text><text x="30" y="78" fill="#a7bacb" font-size="19">主线矩阵 A 的三列：a₁ = (1,0,0)，a₂ = (0,1,0)，a₃ = (1,1,0)。</text><polygon points="233.5,436.5 597.5,352.5 410,190 46.0,274.0" fill="#71c9ff" fill-opacity="0.12"/><line x1="300" y1="380" x2="560" y2="320" stroke="#a7bacb" stroke-width="1" stroke-dasharray=""/><polygon points="560,320 551.090997624065,326.4521063743235 549.1645804643437,318.10429868219757" fill="#a7bacb" fill-opacity="1"/><text x="567" y="320" fill="#a7bacb" font-size="19">y₁</text><line x1="300" y1="380" x2="150" y2="250" stroke="#a7bacb" stroke-width="1" stroke-dasharray=""/><polygon points="150,250 160.46185472584457,253.3984696107695 154.85093150468882,259.8726117890261" fill="#a7bacb" fill-opacity="1"/><text x="157" y="250" fill="#a7bacb" font-size="19">y₂</text><line x1="300" y1="380" x2="300" y2="130.0" stroke="#a7bacb" stroke-width="1" stroke-dasharray=""/><polygon points="300,130.0 304.28360176539513,140.13167093403175 295.71639823460487,140.13167093403175" fill="#a7bacb" fill-opacity="1"/><text x="307" y="130.0" fill="#a7bacb" font-size="19">y₃</text><line x1="300" y1="380" x2="430" y2="350" stroke="#ff8d83" stroke-width="4" stroke-dasharray=""/><polygon points="430,350 421.0909976240651,356.4521063743235 419.1645804643437,348.10429868219757" fill="#ff8d83" fill-opacity="1"/><text x="440" y="338" fill="#ff8d83" font-size="23">a₁</text><line x1="300" y1="380" x2="225" y2="315" stroke="#71c9ff" stroke-width="4" stroke-dasharray=""/><polygon points="225,315 235.46185472584457,318.3984696107695 229.85093150468882,324.8726117890261" fill="#71c9ff" fill-opacity="1"/><text x="235" y="303" fill="#71c9ff" font-size="23">a₂</text><line x1="300" y1="380" x2="355" y2="285" stroke="#f8d174" stroke-width="4" stroke-dasharray=""/><polygon points="355,285 353.6308069451633,295.9144541951756 346.21652381655065,291.62197448913673" fill="#f8d174" fill-opacity="1"/><text x="365" y="273" fill="#f8d174" font-size="23">a₃</text><line x1="430" y1="350" x2="355" y2="285" stroke="#71c9ff" stroke-width="2" stroke-dasharray="5 5"/><line x1="225" y1="315" x2="355" y2="285" stroke="#ff8d83" stroke-width="2" stroke-dasharray="5 5"/><text x="640" y="175" fill="#f8d174" font-size="29">a₃ = a₁ + a₂</text><text x="640" y="229" fill="#e6edf4" font-size="23">第三列没有增加独立方向。</text><text x="640" y="284" fill="#e6edf4" font-size="23">列空间：全部 (p,q,0)</text><text x="640" y="329" fill="#e6edf4" font-size="23">一组基：a₁、a₂</text><text x="640" y="374" fill="#f8d174" font-size="26">秩：2</text><text x="30" y="483" fill="#a7bacb" font-size="20">浅蓝色区域表示输出平面的一部分；列空间本身无限延伸。</text></g></svg>