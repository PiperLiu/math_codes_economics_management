<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="570" viewBox="0 0 1000 570"><title>② 再选输入：同样好的输出，选最短的来源</title><desc>输入解直线 x1+x2=2 上的候选点全部映到右侧 p=(2,0)。从原点到候选输入的长度在 x=(1,1) 时最短。</desc><rect width="1000" height="570" fill="#101d2b"/><g font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif"><text x="28" y="40" fill="#e6edf4" font-size="28">② 再选输入：同样好的输出，选最短的来源</text><text x="28" y="83" fill="#a7bacb" font-size="23">输入 x = (1+t, 1−t)；改变 t，输出始终是 (2,0)。</text><text x="40" y="131" fill="#71c9ff" font-size="23">输入空间：比较输入长度</text><text x="560" y="131" fill="#71c9ff" font-size="23">输出空间：预测保持不变</text><path d="M55,460 L55,180" stroke="#20394d" stroke-width="1" fill="none"/><path d="M125,460 L125,180" stroke="#20394d" stroke-width="1" fill="none"/><path d="M195,460 L195,180" stroke="#20394d" stroke-width="1" fill="none"/><path d="M265,460 L265,180" stroke="#20394d" stroke-width="1" fill="none"/><path d="M335,460 L335,180" stroke="#20394d" stroke-width="1" fill="none"/><path d="M405,460 L405,180" stroke="#20394d" stroke-width="1" fill="none"/><path d="M55,460 L405,460" stroke="#20394d" stroke-width="1" fill="none"/><path d="M55,390 L405,390" stroke="#20394d" stroke-width="1" fill="none"/><path d="M55,320 L405,320" stroke="#20394d" stroke-width="1" fill="none"/><path d="M55,250 L405,250" stroke="#20394d" stroke-width="1" fill="none"/><path d="M55,180 L405,180" stroke="#20394d" stroke-width="1" fill="none"/><path d="M55,390 L405,390" stroke="#a7bacb" stroke-width="3" fill="none"/><path d="M125,460 L125,180" stroke="#a7bacb" stroke-width="3" fill="none"/><text x="410" y="415" fill="#a7bacb" font-size="20">x₁</text><text x="95" y="165" fill="#a7bacb" font-size="20">x₂</text><text x="119" y="414" fill="#a7bacb" font-size="16">0</text><text x="189" y="414" fill="#a7bacb" font-size="16">1</text><text x="259" y="414" fill="#a7bacb" font-size="16">2</text><text x="329" y="414" fill="#a7bacb" font-size="16">3</text><path d="M575,460 L575,180" stroke="#20394d" stroke-width="1" fill="none"/><path d="M645,460 L645,180" stroke="#20394d" stroke-width="1" fill="none"/><path d="M715,460 L715,180" stroke="#20394d" stroke-width="1" fill="none"/><path d="M785,460 L785,180" stroke="#20394d" stroke-width="1" fill="none"/><path d="M855,460 L855,180" stroke="#20394d" stroke-width="1" fill="none"/><path d="M925,460 L925,180" stroke="#20394d" stroke-width="1" fill="none"/><path d="M575,460 L925,460" stroke="#20394d" stroke-width="1" fill="none"/><path d="M575,390 L925,390" stroke="#20394d" stroke-width="1" fill="none"/><path d="M575,320 L925,320" stroke="#20394d" stroke-width="1" fill="none"/><path d="M575,250 L925,250" stroke="#20394d" stroke-width="1" fill="none"/><path d="M575,180 L925,180" stroke="#20394d" stroke-width="1" fill="none"/><path d="M575,390 L925,390" stroke="#a7bacb" stroke-width="3" fill="none"/><path d="M645,460 L645,180" stroke="#a7bacb" stroke-width="3" fill="none"/><text x="930" y="415" fill="#a7bacb" font-size="20">y₁</text><text x="615" y="165" fill="#a7bacb" font-size="20">y₂</text><text x="639" y="414" fill="#a7bacb" font-size="16">0</text><text x="709" y="414" fill="#a7bacb" font-size="16">1</text><text x="779" y="414" fill="#a7bacb" font-size="16">2</text><text x="849" y="414" fill="#a7bacb" font-size="16">3</text><path d="M69.0,194.0 L321.0,446.0" stroke="#71c9ff" stroke-width="4" fill="none"/><path d="M125,390 L155.96934463957908,280.96934463957905" stroke="#f8d174" stroke-width="4" fill="none"/><circle cx="195" cy="320" r="6" fill="#71c9ff"/><circle cx="155.96934463957908" cy="280.96934463957905" r="6" fill="#f8d174"/><text x="225" y="240" fill="#71c9ff" font-size="20">最短点 (1,1)</text><text x="445" y="275" fill="#e6edf4" font-size="24">D →</text><path d="M575,390 L925,390" stroke="#71c9ff" stroke-width="4" fill="none"/><circle cx="785" cy="390" r="6" fill="#f8d174"/><circle cx="785" cy="320" r="6" fill="#ff8d83"/><path d="M785,390 L785,320" stroke="#ff8d83" stroke-width="3" fill="none"/><text x="805" y="312" fill="#ff8d83" font-size="23">b</text><text x="805" y="379" fill="#f8d174" font-size="23">p</text><text x="40" y="490" fill="#f8d174" font-size="23">t = -0.56；长度平方 = 2 + 2t² = 2.62</text><text x="560" y="490" fill="#ff8d83" font-size="23">残差平方始终等于 1。</text><text x="28" y="546" fill="#a7bacb" font-size="20">蓝斜线上的输入都最小化残差；只有 (1,1) 同时具有最小输入长度。</text></g></svg>