<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600"><title>传感器融合：三个读数，如何分配权重？</title><desc>三个无偏误差互不相关的传感器，误差方差1、4、9。非负权重和为1。最优权重36/49、9/49、4/49。</desc><rect width="1000" height="600" fill="#101d2b"/><g font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif"><text x="25" y="42" fill="#e6edf4" font-size="28">传感器融合：三个读数，如何分配权重？</text><text x="35" y="160" fill="#71c9ff" font-size="24">传感器 1：误差方差 1</text><rect x="380" y="132" width="367.3469387755102" height="35" fill="#71c9ff"/><text x="380" y="202" fill="#71c9ff" font-size="21">权重 36/49 ≈ 0.735</text><text x="35" y="275" fill="#f8d174" font-size="24">传感器 2：误差方差 4</text><rect x="380" y="247" width="91.83673469387755" height="35" fill="#f8d174"/><text x="380" y="317" fill="#f8d174" font-size="21">权重 9/49 ≈ 0.184</text><text x="35" y="390" fill="#ff8d83" font-size="24">传感器 3：误差方差 9</text><rect x="380" y="362" width="40.816326530612244" height="35" fill="#ff8d83"/><text x="380" y="432" fill="#ff8d83" font-size="21">权重 4/49 ≈ 0.082</text><text x="35" y="520" fill="#e6edf4" font-size="22">权重与方差的倒数成比例：更稳定的读数获得更大权重。</text><text x="35" y="565" fill="#a7bacb" font-size="21">融合误差方差 36/49 ≈ 0.735；这依赖无偏、协方差已知及模型约束。</text></g></svg>