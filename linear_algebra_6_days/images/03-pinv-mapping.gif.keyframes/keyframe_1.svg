<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="570" viewBox="0 0 1000 570"><title>③ 合起来看：D⁺ 把每份读数送到最短输入</title><desc>读数 b 在输出空间中绕圈。每帧独立计算 p=(b1,0) 和 D+ b=(b1/2,b1/2)；右侧最短输入沿对角线移动。</desc><rect width="1000" height="570" fill="#101d2b"/><g font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif"><text x="28" y="40" fill="#e6edf4" font-size="28">③ 合起来看：D⁺ 把每份读数送到最短输入</text><text x="28" y="83" fill="#a7bacb" font-size="23">D⁺b = (b₁/2, b₁/2)：先投到横轴，再平均分配总量。</text><text x="40" y="131" fill="#71c9ff" font-size="23">输出空间：给定读数 b</text><text x="560" y="131" fill="#71c9ff" font-size="23">输入空间：选出的 D⁺b</text><path d="M55,460 L55,180" stroke="#20394d" stroke-width="1" fill="none"/><path d="M125,460 L125,180" stroke="#20394d" stroke-width="1" fill="none"/><path d="M195,460 L195,180" stroke="#20394d" stroke-width="1" fill="none"/><path d="M265,460 L265,180" stroke="#20394d" stroke-width="1" fill="none"/><path d="M335,460 L335,180" stroke="#20394d" stroke-width="1" fill="none"/><path d="M405,460 L405,180" stroke="#20394d" stroke-width="1" fill="none"/><path d="M55,460 L405,460" stroke="#20394d" stroke-width="1" fill="none"/><path d="M55,390 L405,390" stroke="#20394d" stroke-width="1" fill="none"/><path d="M55,320 L405,320" stroke="#20394d" stroke-width="1" fill="none"/><path d="M55,250 L405,250" stroke="#20394d" stroke-width="1" fill="none"/><path d="M55,180 L405,180" stroke="#20394d" stroke-width="1" fill="none"/><path d="M55,390 L405,390" stroke="#a7bacb" stroke-width="3" fill="none"/><path d="M125,460 L125,180" stroke="#a7bacb" stroke-width="3" fill="none"/><text x="410" y="415" fill="#a7bacb" font-size="20">y₁</text><text x="95" y="165" fill="#a7bacb" font-size="20">y₂</text><text x="119" y="414" fill="#a7bacb" font-size="16">0</text><text x="189" y="414" fill="#a7bacb" font-size="16">1</text><text x="259" y="414" fill="#a7bacb" font-size="16">2</text><text x="329" y="414" fill="#a7bacb" font-size="16">3</text><path d="M575,460 L575,180" stroke="#20394d" stroke-width="1" fill="none"/><path d="M645,460 L645,180" stroke="#20394d" stroke-width="1" fill="none"/><path d="M715,460 L715,180" stroke="#20394d" stroke-width="1" fill="none"/><path d="M785,460 L785,180" stroke="#20394d" stroke-width="1" fill="none"/><path d="M855,460 L855,180" stroke="#20394d" stroke-width="1" fill="none"/><path d="M925,460 L925,180" stroke="#20394d" stroke-width="1" fill="none"/><path d="M575,460 L925,460" stroke="#20394d" stroke-width="1" fill="none"/><path d="M575,390 L925,390" stroke="#20394d" stroke-width="1" fill="none"/><path d="M575,320 L925,320" stroke="#20394d" stroke-width="1" fill="none"/><path d="M575,250 L925,250" stroke="#20394d" stroke-width="1" fill="none"/><path d="M575,180 L925,180" stroke="#20394d" stroke-width="1" fill="none"/><path d="M575,390 L925,390" stroke="#a7bacb" stroke-width="3" fill="none"/><path d="M645,460 L645,180" stroke="#a7bacb" stroke-width="3" fill="none"/><text x="930" y="415" fill="#a7bacb" font-size="20">x₁</text><text x="615" y="165" fill="#a7bacb" font-size="20">x₂</text><text x="639" y="414" fill="#a7bacb" font-size="16">0</text><text x="709" y="414" fill="#a7bacb" font-size="16">1</text><text x="779" y="414" fill="#a7bacb" font-size="16">2</text><text x="849" y="414" fill="#a7bacb" font-size="16">3</text><path d="M55,390 L405,390" stroke="#71c9ff" stroke-width="4" fill="none"/><circle cx="265" cy="390" r="70" fill="none" stroke="#486073" stroke-dasharray="5 6"/><path d="M335.0,390.0 L335.0,390" stroke="#ff8d83" stroke-width="3" fill="none"/><circle cx="335.0" cy="390.0" r="6" fill="#ff8d83"/><circle cx="335.0" cy="390" r="6" fill="#71c9ff"/><path d="M596.0,439.0 L841.0,194.0" stroke="#71c9ff" stroke-width="3" fill="none"/><path d="M645,390 L750.0,285.0" stroke="#f8d174" stroke-width="4" fill="none"/><circle cx="750.0" cy="285.0" r="6" fill="#f8d174"/><text x="445" y="275" fill="#e6edf4" font-size="23">D⁺ →</text><text x="690" y="170" fill="#f8d174" font-size="20">x₁ = x₂：最短输入方向</text><text x="40" y="490" fill="#ff8d83" font-size="23">b = (3.00, 0.00)</text><text x="560" y="490" fill="#f8d174" font-size="23">D⁺b = (1.50, 1.50)</text><text x="28" y="546" fill="#a7bacb" font-size="20">再乘 D 只回到 p，不一定回到 b；伪逆给出选择，不能补回丢失的信息。</text></g></svg>