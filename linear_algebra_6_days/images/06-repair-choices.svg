<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600"><title>同一份数据，不同约束，对应不同修复结果</title><desc>原矩阵[[1,1.2],[1.2,1]]；仅PSD修复为全1.1，单位对角线加PSD修复为全1。</desc><rect width="1000" height="600" fill="#101d2b"/><g font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif"><text x="25" y="44" fill="#e6edf4" font-size="28">同一份数据，不同约束，对应不同修复结果</text><text x="25" y="105" fill="#a7bacb" font-size="22">原矩阵 A = [[1, 1.2], [1.2, 1]]；特征值 2.2、−0.2</text><rect x="35" y="145" width="440" height="340" rx="16" fill="#163044"/><text x="55" y="198" fill="#71c9ff" font-size="25">只要求半正定</text><path d="M125.000,256.000 L125.000,343.000" fill="none" stroke="#e6edf4" stroke-width="2"/><path d="M320.000,256.000 L320.000,343.000" fill="none" stroke="#e6edf4" stroke-width="2"/><path d="M125.000,256.000 L134.000,256.000" fill="none" stroke="#e6edf4" stroke-width="2"/><path d="M125.000,343.000 L134.000,343.000" fill="none" stroke="#e6edf4" stroke-width="2"/><path d="M320.000,256.000 L311.000,256.000" fill="none" stroke="#e6edf4" stroke-width="2"/><path d="M320.000,343.000 L311.000,343.000" fill="none" stroke="#e6edf4" stroke-width="2"/><text x="140" y="280" fill="#e6edf4" font-size="24">1.1</text><text x="240" y="280" fill="#e6edf4" font-size="24">1.1</text><text x="140" y="328" fill="#e6edf4" font-size="24">1.1</text><text x="240" y="328" fill="#e6edf4" font-size="24">1.1</text><text x="55" y="402" fill="#e6edf4" font-size="20">截断负特征值；对角线变为 1.1</text><rect x="525" y="145" width="440" height="340" rx="16" fill="#163044"/><text x="545" y="198" fill="#71c9ff" font-size="25">半正定 + 对角线为 1</text><path d="M615.000,256.000 L615.000,343.000" fill="none" stroke="#e6edf4" stroke-width="2"/><path d="M810.000,256.000 L810.000,343.000" fill="none" stroke="#e6edf4" stroke-width="2"/><path d="M615.000,256.000 L624.000,256.000" fill="none" stroke="#e6edf4" stroke-width="2"/><path d="M615.000,343.000 L624.000,343.000" fill="none" stroke="#e6edf4" stroke-width="2"/><path d="M810.000,256.000 L801.000,256.000" fill="none" stroke="#e6edf4" stroke-width="2"/><path d="M810.000,343.000 L801.000,343.000" fill="none" stroke="#e6edf4" stroke-width="2"/><text x="630" y="280" fill="#e6edf4" font-size="24">1</text><text x="730" y="280" fill="#e6edf4" font-size="24">1</text><text x="630" y="328" fill="#e6edf4" font-size="24">1</text><text x="730" y="328" fill="#e6edf4" font-size="24">1</text><text x="545" y="402" fill="#e6edf4" font-size="20">对角线必须保留；改变两处非对角项</text><text x="55" y="450" fill="#f8d174" font-size="21">全部条目的平方改动量：0.04</text><text x="545" y="450" fill="#f8d174" font-size="21">全部条目的平方改动量：0.08</text><text x="25" y="545" fill="#a7bacb" font-size="22">增加约束后，允许的候选更少，最近距离可能变大。</text><text x="25" y="582" fill="#ff8d83" font-size="21">把左图对角线直接改回 1，会重新得到不定矩阵。</text></g></svg>