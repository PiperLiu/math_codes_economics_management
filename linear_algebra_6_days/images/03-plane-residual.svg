<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620"><title>最近可达输出：留下的差必须垂直于列空间</title><desc>左侧是穿过目标与垂足的截面示意，不是三维坐标图。右侧列出 M 与读数 b 对应的真实坐标。</desc><rect width="1100" height="620" fill="#101d2b"/><g font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif"><text x="30" y="45" fill="#e6edf4" font-size="29">最近可达输出：留下的差必须垂直于列空间</text><text x="30" y="90" fill="#a7bacb" font-size="22">几何截面示意（不按右侧坐标绘制）</text><path d="M60,430 L510,430" fill="none" stroke="#71c9ff" stroke-width="5"/><circle cx="280" cy="430" r="6" fill="#71c9ff"/><circle cx="280" cy="175" r="6" fill="#ff8d83"/><circle cx="420" cy="430" r="6" fill="#f8d174"/><path d="M280,430 L280,175" fill="none" stroke="#ff8d83" stroke-width="3"/><path d="M420,430 L280,175" fill="none" stroke="#a7bacb" stroke-width="3" stroke-dasharray="8 6"/><path d="M280,410 L300,410" fill="none" stroke="#e6edf4" stroke-width="2"/><path d="M300,410 L300,430" fill="none" stroke="#e6edf4" stroke-width="2"/><text x="260" y="468" fill="#71c9ff" font-size="22">p</text><text x="285" y="150" fill="#ff8d83" font-size="22">b</text><text x="425" y="465" fill="#f8d174" font-size="22">y</text><text x="90" y="510" fill="#71c9ff" font-size="22">列空间与截面的交线</text><text x="160" y="290" fill="#ff8d83" font-size="22">残差 r</text><text x="600" y="135" fill="#71c9ff" font-size="26">三维算例：y₃ = y₁ + y₂</text><text x="600" y="205" fill="#ff8d83" font-size="22">目标 b = (2, 1, 4)</text><text x="600" y="275" fill="#71c9ff" font-size="22">最近点 p = (7/3, 4/3, 11/3)</text><text x="600" y="345" fill="#ff8d83" font-size="22">残差 r = (−1/3, −1/3, 1/3)</text><text x="600" y="415" fill="#e6edf4" font-size="22">p 在平面内；r 垂直于两列。</text><text x="600" y="485" fill="#f8d174" font-size="22">输入估计 x̂ = (7/3, 4/3)</text><text x="30" y="580" fill="#a7bacb" font-size="22">最近输出 p 在三维读数空间；估计输入 x̂ 在二维输入空间。</text></g></svg>