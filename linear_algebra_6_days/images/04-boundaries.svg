<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600"><title>不是每个矩阵，都有足够的特征方向</title><desc>左侧九十度旋转没有实特征方向；右侧错切只有水平方向的特征向量，不能组成二维基。</desc><rect width="1000" height="600" fill="#101d2b"/><g font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif"><text x="25" y="40" fill="#e6edf4" font-size="28">不是每个矩阵，都有足够的特征方向</text><path d="M110,460 L110,200" stroke="#22394a" stroke-width="1" fill="none"/><path d="M110,460 L370,460" stroke="#22394a" stroke-width="1" fill="none"/><path d="M175,460 L175,200" stroke="#22394a" stroke-width="1" fill="none"/><path d="M110,395 L370,395" stroke="#22394a" stroke-width="1" fill="none"/><path d="M240,460 L240,200" stroke="#22394a" stroke-width="1" fill="none"/><path d="M110,330 L370,330" stroke="#22394a" stroke-width="1" fill="none"/><path d="M305,460 L305,200" stroke="#22394a" stroke-width="1" fill="none"/><path d="M110,265 L370,265" stroke="#22394a" stroke-width="1" fill="none"/><path d="M370,460 L370,200" stroke="#22394a" stroke-width="1" fill="none"/><path d="M110,200 L370,200" stroke="#22394a" stroke-width="1" fill="none"/><path d="M110,330 L370,330" stroke="#a7bacb" stroke-width="2" fill="none"/><path d="M240,460 L240,200" stroke="#a7bacb" stroke-width="2" fill="none"/><text x="35" y="130" fill="#71c9ff" font-size="24">旋转 90°：没有实特征向量</text><path d="M240,330 L305,330" stroke="#f8d174" stroke-width="4" fill="none"/><circle cx="305" cy="330" r="5" fill="#f8d174"/><path d="M240,330 L240,265" stroke="#ff8d83" stroke-width="4" fill="none"/><circle cx="240" cy="265" r="5" fill="#ff8d83"/><path d="M620,460 L620,200" stroke="#22394a" stroke-width="1" fill="none"/><path d="M620,460 L880,460" stroke="#22394a" stroke-width="1" fill="none"/><path d="M685,460 L685,200" stroke="#22394a" stroke-width="1" fill="none"/><path d="M620,395 L880,395" stroke="#22394a" stroke-width="1" fill="none"/><path d="M750,460 L750,200" stroke="#22394a" stroke-width="1" fill="none"/><path d="M620,330 L880,330" stroke="#22394a" stroke-width="1" fill="none"/><path d="M815,460 L815,200" stroke="#22394a" stroke-width="1" fill="none"/><path d="M620,265 L880,265" stroke="#22394a" stroke-width="1" fill="none"/><path d="M880,460 L880,200" stroke="#22394a" stroke-width="1" fill="none"/><path d="M620,200 L880,200" stroke="#22394a" stroke-width="1" fill="none"/><path d="M620,330 L880,330" stroke="#a7bacb" stroke-width="2" fill="none"/><path d="M750,460 L750,200" stroke="#a7bacb" stroke-width="2" fill="none"/><text x="545" y="130" fill="#71c9ff" font-size="24">错切：只有一条特征直线</text><path d="M750,330 L750,265" stroke="#f8d174" stroke-width="4" fill="none"/><circle cx="750" cy="265" r="5" fill="#f8d174"/><path d="M750,330 L815,265" stroke="#ff8d83" stroke-width="4" fill="none"/><circle cx="815" cy="265" r="5" fill="#ff8d83"/><text x="30" y="505" fill="#e6edf4" font-size="22">旋转后的非零箭头总与原箭头垂直。</text><text x="540" y="505" fill="#e6edf4" font-size="22">水平箭头不变；竖直箭头变斜。</text><text x="30" y="565" fill="#a7bacb" font-size="22">金色为输入，红色为输出。寻找同方向特征向量失败时，仍可使用 SVD。</text></g></svg>