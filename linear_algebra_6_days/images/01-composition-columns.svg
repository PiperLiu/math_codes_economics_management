<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620"><title>乘积的每一列：追踪同一支基向量，连续经过两次变换</title><desc>S：横向放大两倍；R：逆时针旋转 90°。右边的 S 先作用。</desc><rect width="1100" height="620" fill="#101d2b"/><g font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif"><text x="30" y="42" fill="#e6edf4" font-size="27">乘积的每一列：追踪同一支基向量，连续经过两次变换</text><text x="30" y="78" fill="#a7bacb" font-size="18">S：横向放大两倍；R：逆时针旋转 90°。右边的 S 先作用。</text><text x="50" y="140" fill="#e6edf4" font-size="24">输入基向量</text><text x="365" y="140" fill="#e6edf4" font-size="24">先经过 S</text><text x="680" y="140" fill="#e6edf4" font-size="24">再经过 R</text><text x="50" y="230" fill="#ff8d83" font-size="24">e₁ = (1,0)</text><text x="365" y="230" fill="#ff8d83" font-size="24">S e₁ = (2,0)</text><text x="680" y="230" fill="#ff8d83" font-size="24">R(S e₁) = (0,2)</text><line x1="245" y1="222" x2="340" y2="222" stroke="#ff8d83" stroke-width="3" stroke-dasharray=""/><polygon points="340,222 328.94726807196537,226.6730201077038 328.94726807196537,217.3269798922962" fill="#ff8d83"/><line x1="575" y1="222" x2="655" y2="222" stroke="#ff8d83" stroke-width="3" stroke-dasharray=""/><polygon points="655,222 643.9472680719654,226.6730201077038 643.9472680719654,217.3269798922962" fill="#ff8d83"/><text x="50" y="350" fill="#71c9ff" font-size="24">e₂ = (0,1)</text><text x="365" y="350" fill="#71c9ff" font-size="24">S e₂ = (0,1)</text><text x="680" y="350" fill="#71c9ff" font-size="24">R(S e₂) = (−1,0)</text><line x1="245" y1="342" x2="340" y2="342" stroke="#71c9ff" stroke-width="3" stroke-dasharray=""/><polygon points="340,342 328.94726807196537,346.6730201077038 328.94726807196537,337.3269798922962" fill="#71c9ff"/><line x1="575" y1="342" x2="655" y2="342" stroke="#71c9ff" stroke-width="3" stroke-dasharray=""/><polygon points="655,342 643.9472680719654,346.6730201077038 643.9472680719654,337.3269798922962" fill="#71c9ff"/><text x="50" y="440" fill="#e6edf4" font-size="23">把两个最终坐标按原顺序排成列：</text><text x="585" y="465" fill="#e6edf4" font-size="26">RS =</text><text x="700" y="440" fill="#ff8d83" font-size="28">0</text><text x="770" y="440" fill="#71c9ff" font-size="28">−1</text><text x="700" y="487" fill="#ff8d83" font-size="28">2</text><text x="785" y="487" fill="#71c9ff" font-size="28">0</text><line x1="680" y1="410" x2="680" y2="505" stroke="#a7bacb" stroke-width="2" stroke-dasharray=""/><line x1="830" y1="410" x2="830" y2="505" stroke="#a7bacb" stroke-width="2" stroke-dasharray=""/><line x1="680" y1="410" x2="690" y2="410" stroke="#a7bacb" stroke-width="2" stroke-dasharray=""/><line x1="680" y1="505" x2="690" y2="505" stroke="#a7bacb" stroke-width="2" stroke-dasharray=""/><line x1="820" y1="410" x2="830" y2="410" stroke="#a7bacb" stroke-width="2" stroke-dasharray=""/><line x1="820" y1="505" x2="830" y2="505" stroke="#a7bacb" stroke-width="2" stroke-dasharray=""/><text x="50" y="560" fill="#f8d174" font-size="23">一般规则：AB 的第 j 列 = A(B eⱼ) = A × B 的第 j 列。</text></g></svg>