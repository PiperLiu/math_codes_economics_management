<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="570" viewBox="0 0 1000 570"><title>① 先选输出：哪一个可达点离读数最近？</title><desc>D(x1,x2)=(x1+x2,0)。固定读数 b=(2,1)，候选输出沿横轴往返；距离在 p=(2,0) 处最小。</desc><rect width="1000" height="570" fill="#101d2b"/><g font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif"><text x="28" y="40" fill="#e6edf4" font-size="28">① 先选输出：哪一个可达点离读数最近？</text><text x="28" y="83" fill="#a7bacb" font-size="23">固定读数 b = (2,1)；蓝色横轴是 D 的全部可达输出。</text><text x="40" y="131" fill="#71c9ff" font-size="23">输出空间</text><path d="M55,460 L55,180" stroke="#20394d" stroke-width="1" fill="none"/><path d="M125,460 L125,180" stroke="#20394d" stroke-width="1" fill="none"/><path d="M195,460 L195,180" stroke="#20394d" stroke-width="1" fill="none"/><path d="M265,460 L265,180" stroke="#20394d" stroke-width="1" fill="none"/><path d="M335,460 L335,180" stroke="#20394d" stroke-width="1" fill="none"/><path d="M405,460 L405,180" stroke="#20394d" stroke-width="1" fill="none"/><path d="M55,460 L405,460" stroke="#20394d" stroke-width="1" fill="none"/><path d="M55,390 L405,390" stroke="#20394d" stroke-width="1" fill="none"/><path d="M55,320 L405,320" stroke="#20394d" stroke-width="1" fill="none"/><path d="M55,250 L405,250" stroke="#20394d" stroke-width="1" fill="none"/><path d="M55,180 L405,180" stroke="#20394d" stroke-width="1" fill="none"/><path d="M55,390 L405,390" stroke="#a7bacb" stroke-width="3" fill="none"/><path d="M125,460 L125,180" stroke="#a7bacb" stroke-width="3" fill="none"/><text x="410" y="415" fill="#a7bacb" font-size="20">y₁</text><text x="95" y="165" fill="#a7bacb" font-size="20">y₂</text><text x="119" y="414" fill="#a7bacb" font-size="16">0</text><text x="189" y="414" fill="#a7bacb" font-size="16">1</text><text x="259" y="414" fill="#a7bacb" font-size="16">2</text><text x="329" y="414" fill="#a7bacb" font-size="16">3</text><path d="M55,390 L405,390" stroke="#71c9ff" stroke-width="4" fill="none"/><path d="M225.96934463957908,390 L265,320" stroke="#ff8d83" stroke-width="3" fill="none"/><path d="M265,390 L265,320" stroke="#a7bacb" stroke-width="3" fill="none" stroke-dasharray="7 6"/><circle cx="265" cy="320" r="6" fill="#ff8d83"/><circle cx="265" cy="390" r="6" fill="#71c9ff"/><circle cx="225.96934463957908" cy="390" r="6" fill="#f8d174"/><text x="280" y="305" fill="#ff8d83" font-size="23">b = (2,1)</text><text x="250" y="445" fill="#71c9ff" font-size="23">p = (2,0)</text><text x="560" y="170" fill="#f8d174" font-size="23">金点 q：正在比较的候选输出</text><text x="560" y="230" fill="#e6edf4" font-size="23">q = (1.44, 0)</text><text x="560" y="290" fill="#ff8d83" font-size="23">距离平方 = 1 + (q₁ − 2)² = 1.31</text><text x="560" y="355" fill="#71c9ff" font-size="23">最小值为 1，在 q = p 时取得。</text><text x="560" y="420" fill="#e6edf4" font-size="23">原读数不在横轴上，不能精确到达。</text><text x="28" y="505" fill="#f8d174" font-size="23">这一步只在输出空间选点，还没有决定用哪一份输入产生 p。</text><text x="28" y="546" fill="#a7bacb" font-size="20">固定坐标；往返只用于比较候选点，不是反复应用矩阵。</text></g></svg>