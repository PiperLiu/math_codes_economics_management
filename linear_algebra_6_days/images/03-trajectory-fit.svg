<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620"><title>轨迹拟合：三次位置差，组成一个残差向量</title><desc>教学数据：时间 -1,0,1 秒，位置 0,1,3 米。拟合直线 s=4/3+3t/2；红段为同一时刻的竖直位置差。</desc><rect width="1100" height="620" fill="#101d2b"/><g font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif"><text x="30" y="45" fill="#e6edf4" font-size="29">轨迹拟合：三次位置差，组成一个残差向量</text><path d="M85,455 L510,455" fill="none" stroke="#263c50" stroke-width="1"/><text x="52" y="462" fill="#a7bacb" font-size="18">0</text><path d="M85,360 L510,360" fill="none" stroke="#263c50" stroke-width="1"/><text x="52" y="367" fill="#a7bacb" font-size="18">1</text><path d="M85,265 L510,265" fill="none" stroke="#263c50" stroke-width="1"/><text x="52" y="272" fill="#a7bacb" font-size="18">2</text><path d="M85,170 L510,170" fill="none" stroke="#263c50" stroke-width="1"/><text x="52" y="177" fill="#a7bacb" font-size="18">3</text><path d="M85,455 L530,455" fill="none" stroke="#a7bacb" stroke-width="3"/><path d="M85,505 L85,100" fill="none" stroke="#a7bacb" stroke-width="3"/><text x="40" y="90" fill="#a7bacb" font-size="22">位置 / 米</text><text x="400" y="535" fill="#a7bacb" font-size="22">时间 / 秒</text><path d="M107.49999999999997,485.0833333333333 L492.5,171.58333333333331" fill="none" stroke="#71c9ff" stroke-width="3"/><path d="M125,455 L125,470.8333333333333" fill="none" stroke="#ff8d83" stroke-width="5"/><circle cx="125" cy="455" r="6" fill="#f8d174"/><text x="115" y="490" fill="#a7bacb" font-size="18">-1</text><path d="M300,360 L300,328.33333333333337" fill="none" stroke="#ff8d83" stroke-width="5"/><circle cx="300" cy="360" r="6" fill="#f8d174"/><text x="290" y="490" fill="#a7bacb" font-size="18">0</text><path d="M475,170 L475,185.83333333333337" fill="none" stroke="#ff8d83" stroke-width="5"/><circle cx="475" cy="170" r="6" fill="#f8d174"/><text x="465" y="490" fill="#a7bacb" font-size="18">1</text><text x="600" y="130" fill="#f8d174" font-size="25">左图：固定时间，只比较位置</text><text x="600" y="190" fill="#e6edf4" font-size="22">金点：读数     蓝线：匀速模型</text><text x="600" y="245" fill="#ff8d83" font-size="22">红段：竖直位置差，不是斜距</text><text x="600" y="330" fill="#71c9ff" font-size="25">读数空间：每个时刻占一根轴</text><text x="600" y="390" fill="#e6edf4" font-size="22">r = (1/6, −1/3, 1/6)</text><text x="600" y="445" fill="#e6edf4" font-size="22">r ⟂ (1,1,1)，r ⟂ (−1,0,1)</text><text x="600" y="500" fill="#e6edf4" font-size="22">垂直的是残差与整个模型平面。</text><text x="30" y="585" fill="#a7bacb" font-size="22">同一组数据：左图画三个点；读数空间把三个位置合成一个三维点。</text></g></svg>