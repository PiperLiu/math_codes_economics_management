<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="580" viewBox="0 0 1100 580"><title>零空间解释重合；列空间决定可达</title><desc>集合关系示意，非三维坐标投影。z₀ = (−1,−1,1)，x₀ = (2,1,0)。</desc><rect width="1100" height="580" fill="#101d2b"/><g font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif"><text x="30" y="42" fill="#e6edf4" font-size="28">零空间解释重合；列空间决定可达</text><text x="30" y="78" fill="#a7bacb" font-size="19">集合关系示意，非三维坐标投影。z₀ = (−1,−1,1)，x₀ = (2,1,0)。</text><text x="55" y="135" fill="#e6edf4" font-size="24">输入空间</text><text x="700" y="135" fill="#e6edf4" font-size="24">输出空间</text><line x1="65" y1="295" x2="430" y2="200" stroke="#71c9ff" stroke-width="3" stroke-dasharray=""/><circle cx="140" cy="275.47945205479454" r="6" fill="#71c9ff"/><circle cx="240" cy="249.45205479452056" r="6" fill="#71c9ff"/><circle cx="340" cy="223.4246575342466" r="6" fill="#71c9ff"/><text x="60" y="177" fill="#71c9ff" font-size="22">零空间：t z₀</text><line x1="445" y1="245" x2="690" y2="245" stroke="#71c9ff" stroke-width="3" stroke-dasharray=""/><polygon points="690,245 679.8683290659683,249.28360176539516 679.8683290659683,240.71639823460484" fill="#71c9ff" fill-opacity="1"/><text x="520" y="230" fill="#71c9ff" font-size="18">作用 A</text><line x1="65" y1="455" x2="430" y2="360" stroke="#f8d174" stroke-width="3" stroke-dasharray=""/><circle cx="140" cy="435.47945205479454" r="6" fill="#f8d174"/><circle cx="240" cy="409.45205479452056" r="6" fill="#f8d174"/><circle cx="340" cy="383.4246575342466" r="6" fill="#f8d174"/><text x="60" y="337" fill="#f8d174" font-size="22">全部解：x₀ + t z₀</text><line x1="445" y1="405" x2="690" y2="405" stroke="#f8d174" stroke-width="3" stroke-dasharray=""/><polygon points="690,405 679.8683290659683,409.28360176539513 679.8683290659683,400.71639823460487" fill="#f8d174" fill-opacity="1"/><text x="520" y="390" fill="#f8d174" font-size="18">作用 A</text><polygon points="710,205 1025,205 1060,480 745,480" fill="#71c9ff" fill-opacity="0.1"/><circle cx="790" cy="245" r="6" fill="#71c9ff"/><text x="809" y="250" fill="#71c9ff" font-size="24">0</text><circle cx="790" cy="405" r="6" fill="#f8d174"/><text x="809" y="410" fill="#f8d174" font-size="22">b = (2,1,0)</text><text x="765" y="465" fill="#a7bacb" font-size="20">列空间：y₃ = 0</text><circle cx="970" cy="165" r="6" fill="#ff8d83"/><text x="720" y="181" fill="#ff8d83" font-size="20">不可达：b′ = (2,1,1)</text><text x="50" y="541" fill="#a7bacb" font-size="22">沿同一条输入直线移动，输出不变；两条平行直线可对应不同输出。</text></g></svg>