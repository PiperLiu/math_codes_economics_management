<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620"><title>直线投影：沿垂线抵达最近点</title><desc>固定二维等比例坐标。a=(1,1)，b=(3,1)，p=(2,2)，q=(0.5,0.5)。红线是残差，蓝线为可达直线。</desc><rect width="1100" height="620" fill="#101d2b"/><g font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif"><text x="30" y="45" fill="#e6edf4" font-size="29">直线投影：沿垂线抵达最近点</text><path d="M90,485 L90,65" fill="none" stroke="#263c50" stroke-width="1"/><path d="M90,485 L510,485" fill="none" stroke="#263c50" stroke-width="1"/><path d="M195,485 L195,65" fill="none" stroke="#263c50" stroke-width="1"/><path d="M90,380 L510,380" fill="none" stroke="#263c50" stroke-width="1"/><path d="M300,485 L300,65" fill="none" stroke="#263c50" stroke-width="1"/><path d="M90,275 L510,275" fill="none" stroke="#263c50" stroke-width="1"/><path d="M405,485 L405,65" fill="none" stroke="#263c50" stroke-width="1"/><path d="M90,170 L510,170" fill="none" stroke="#263c50" stroke-width="1"/><path d="M510,485 L510,65" fill="none" stroke="#263c50" stroke-width="1"/><path d="M90,65 L510,65" fill="none" stroke="#263c50" stroke-width="1"/><path d="M90,485 L541.5,485" fill="none" stroke="#a7bacb" stroke-width="3"/><path d="M90,485 L90,54.50000000000006" fill="none" stroke="#a7bacb" stroke-width="3"/><text x="535" y="510" fill="#e6edf4" font-size="22">x</text><text x="65" y="65" fill="#e6edf4" font-size="22">y</text><path d="M90,485 L489.0,86.0" fill="none" stroke="#71c9ff" stroke-width="3"/><path d="M142.5,432.5 L405,380" fill="none" stroke="#a7bacb" stroke-width="3" stroke-dasharray="8 6"/><path d="M300,275 L405,380" fill="none" stroke="#ff8d83" stroke-width="3"/><path d="M300,275 L142.5,432.5" fill="none" stroke="#f8d174" stroke-width="3"/><path d="M283.20000000000005,291.79999999999995 L300,308.6" fill="none" stroke="#e6edf4" stroke-width="2"/><path d="M300,308.6 L316.8,291.79999999999995" fill="none" stroke="#e6edf4" stroke-width="2"/><circle cx="90" cy="485" r="6" fill="#a7bacb"/><text x="70" y="510" fill="#a7bacb" font-size="22">0</text><circle cx="142.5" cy="432.5" r="6" fill="#f8d174"/><text x="117.5" y="442.5" fill="#f8d174" font-size="22">q</text><circle cx="300" cy="275" r="6" fill="#71c9ff"/><text x="200" y="255" fill="#71c9ff" font-size="22">p = (2,2)</text><circle cx="405" cy="380" r="6" fill="#ff8d83"/><text x="420" y="380" fill="#ff8d83" font-size="22">b = (3,1)</text><text x="625" y="135" fill="#71c9ff" font-size="22">蓝线：所有可达点 ca</text><text x="625" y="195" fill="#ff8d83" font-size="22">红段：残差 b − p，与蓝线垂直</text><text x="625" y="255" fill="#f8d174" font-size="22">黄段：换一个候选点所多走的路</text><text x="625" y="330" fill="#e6edf4" font-size="22">距离平方 = 红段² + 黄段²</text><text x="625" y="385" fill="#e6edf4" font-size="22">只要 q ≠ p，黄段就非零。</text><text x="625" y="440" fill="#e6edf4" font-size="22">所以 p 是唯一最近点。</text><text x="30" y="575" fill="#a7bacb" font-size="22">坐标等比例；网格间隔为 1。灰色虚线连接另一个候选点 q 与目标 b。</text></g></svg>