<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="690" viewBox="0 0 1100 690"><title>消元：从汇总记录中剔除已有信息</title><desc>第一读数 x1+x3=2，第二读数 x2+x3=1，其和必为 x1+x2+2x3=3。第三条减去前两条后，若汇总为3则得到0=0，若汇总为4则得到0=1。前者是冗余，后者是矛盾。</desc><rect width="1100" height="690" fill="#101d2b"/><g font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif"><text x="30" y="43" fill="#e6edf4" font-size="29">消元：第三条记录还剩多少新信息？</text><text x="30" y="81" fill="#a7bacb" font-size="21">先读等式的含义，再把同样的操作写进矩阵。</text><rect x="30" y="120" width="300" height="140" rx="14" fill="#71c9ff" fill-opacity=".07" stroke="#71c9ff" stroke-width="2"/><text x="52" y="163" fill="#71c9ff" font-size="23">① 第一个显示器</text><text x="52" y="219" fill="#e6edf4" font-size="24">x₁ + x₃ = 2</text><rect x="400" y="120" width="300" height="140" rx="14" fill="#71c9ff" fill-opacity=".07" stroke="#71c9ff" stroke-width="2"/><text x="422" y="163" fill="#71c9ff" font-size="23">② 第二个显示器</text><text x="422" y="219" fill="#e6edf4" font-size="24">x₂ + x₃ = 1</text><rect x="770" y="120" width="300" height="140" rx="14" fill="#f8d174" fill-opacity=".07" stroke="#f8d174" stroke-width="2"/><text x="792" y="163" fill="#f8d174" font-size="23">③ 应有的汇总</text><text x="792" y="219" fill="#e6edf4" font-size="24">x₁ + x₂ + 2x₃ = 3</text><text x="350" y="205" fill="#a7bacb" font-size="30">+</text><text x="721" y="205" fill="#a7bacb" font-size="30">=</text><text x="30" y="311" fill="#e6edf4" font-size="23">③ 的左侧是 ①、② 左侧之和，因此右侧也必须等于 2 + 1。</text><text x="30" y="352" fill="#f8d174" font-size="24">保留 ①、②，把 ③ 改写为：③ − ① − ②。</text><rect x="30" y="387" width="480" height="202" rx="14" fill="#71c9ff" fill-opacity=".07" stroke="#71c9ff" stroke-width="2"/><text x="54" y="428" fill="#71c9ff" font-size="25">汇总记录为 3</text><text x="54" y="472" fill="#e6edf4" font-size="21">左侧：变量项全部抵消，剩下 0</text><text x="54" y="513" fill="#e6edf4" font-size="23">右侧：3 − 2 − 1 = 0</text><text x="54" y="560" fill="#71c9ff" font-size="25">0 = 0：没有新增限制</text><rect x="590" y="387" width="480" height="202" rx="14" fill="#ff8d83" fill-opacity=".07" stroke="#ff8d83" stroke-width="2"/><text x="614" y="428" fill="#ff8d83" font-size="25">汇总记录为 4</text><text x="614" y="472" fill="#e6edf4" font-size="21">左侧：变量项全部抵消，剩下 0</text><text x="614" y="513" fill="#e6edf4" font-size="23">右侧：4 − 2 − 1 = 1</text><text x="614" y="560" fill="#ff8d83" font-size="25">0 = 1：没有输入能够满足</text><text x="30" y="634" fill="#a7bacb" font-size="22">一致时，(2,1,0) 与 (1,0,1) 都能产生读数 (2,1,3)。</text><text x="30" y="670" fill="#a7bacb" font-size="22">第三条只是汇总，仍无法区分这两份输入。</text></g></svg>