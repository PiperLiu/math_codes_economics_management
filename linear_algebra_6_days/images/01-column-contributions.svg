<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="790" viewBox="0 0 1100 790"><title>矩阵乘向量：逐行求结果，按列看贡献</title><desc>输入 x=(2,1)，矩阵 M 的第一列为 (1,0,1)。蓝色连线将 x1=2 与第一列相连；下方三行展开式中，蓝色项分别为 1×2、0×2、1×2，展示 x1 对三个输出维度的贡献 (2,0,2)。第二列按 x2=1 加权后贡献 (0,1,1)，两者相加为 (2,1,3)。</desc><rect width="1100" height="790" fill="#101d2b"/><defs><marker id="tip" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10" fill="#71c9ff"/></marker></defs><g font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif"><text x="30" y="43" fill="#e6edf4" font-size="29">矩阵乘向量：逐行求结果，按列看贡献</text><text x="30" y="80" fill="#a7bacb" font-size="22">第一列的三个系数，分别记录同一个输入 x₁ 对三个输出维度的作用。</text><text x="25" y="267" fill="#e6edf4" font-size="28">Mx =</text><path d="M125,178 h-10 v155 h10 M255,178 h10 v155 h-10" stroke="#a7bacb" stroke-width="2" fill="none"/><rect x="134" y="185" width="47" height="140" rx="10" fill="#71c9ff" fill-opacity="0.1" stroke="#71c9ff" stroke-width="2"/><rect x="214" y="185" width="38" height="140" rx="10" fill="#ff8d83" fill-opacity="0.06" stroke="#ff8d83" stroke-width="2"/><text x="146" y="216" fill="#71c9ff" font-size="29">1</text><text x="221" y="216" fill="#ff8d83" font-size="29">0</text><text x="146" y="263" fill="#71c9ff" font-size="29">0</text><text x="221" y="263" fill="#ff8d83" font-size="29">1</text><text x="146" y="310" fill="#71c9ff" font-size="29">1</text><text x="221" y="310" fill="#ff8d83" font-size="29">1</text><text x="297" y="266" fill="#e6edf4" font-size="30">×</text><path d="M365,204 h-10 v101 h10 M445,204 h10 v101 h-10" stroke="#a7bacb" stroke-width="2" fill="none"/><rect x="375" y="210" width="60" height="40" rx="10" fill="#71c9ff" fill-opacity="0.1" stroke="#71c9ff" stroke-width="2"/><text x="390" y="241" fill="#71c9ff" font-size="29">2</text><text x="390" y="289" fill="#ff8d83" font-size="29">1</text><text x="485" y="266" fill="#e6edf4" font-size="30">=</text><path d="M562,178 h-10 v155 h10 M612,178 h10 v155 h-10" stroke="#a7bacb" stroke-width="2" fill="none"/><text x="575" y="216" fill="#f8d174" font-size="29">2</text><text x="575" y="263" fill="#f8d174" font-size="29">1</text><text x="575" y="310" fill="#f8d174" font-size="29">3</text><text x="350" y="355" fill="#a7bacb" font-size="20">输入 x</text><text x="540" y="355" fill="#a7bacb" font-size="20">输出 y = Mx</text><text x="130" y="355" fill="#71c9ff" font-size="19">第一列</text><text x="210" y="355" fill="#ff8d83" font-size="19">第二列</text><path d="M157,182 C157,115 404,115 404,201" fill="none" stroke="#71c9ff" stroke-width="3" marker-end="url(#tip)"/><text x="210" y="130" fill="#71c9ff" font-size="21">x₁ = 2 乘遍这一列</text><text x="700" y="215" fill="#71c9ff" font-size="23">第一列：(1, 0, 1)</text><text x="700" y="258" fill="#71c9ff" font-size="23">乘上 x₁ = 2</text><text x="700" y="301" fill="#71c9ff" font-size="25">贡献：(2, 0, 2)</text><path d="M30 390 H1070" stroke="#32475b"/><text x="40" y="434" fill="#e6edf4" font-size="23">逐行计算</text><text x="285" y="434" fill="#71c9ff" font-size="23">来自 x₁ 的贡献</text><text x="585" y="434" fill="#ff8d83" font-size="23">来自 x₂ 的贡献</text><text x="925" y="434" fill="#f8d174" font-size="23">输出</text><rect x="265" y="454" width="260" height="178" rx="10" fill="#71c9ff" fill-opacity="0.1" stroke="#71c9ff" stroke-width="2"/><rect x="565" y="454" width="260" height="178" rx="10" fill="#ff8d83" fill-opacity="0.06" stroke="#ff8d83" stroke-width="2"/><text x="60" y="494" fill="#e6edf4" font-size="27">y₁ =</text><text x="295" y="494" fill="#71c9ff" font-size="28">1 × 2</text><text x="537" y="494" fill="#e6edf4" font-size="25">+</text><text x="595" y="494" fill="#ff8d83" font-size="28">0 × 1</text><text x="850" y="494" fill="#a7bacb" font-size="26">=</text><text x="945" y="494" fill="#f8d174" font-size="29">2</text><text x="60" y="548" fill="#e6edf4" font-size="27">y₂ =</text><text x="295" y="548" fill="#71c9ff" font-size="28">0 × 2</text><text x="537" y="548" fill="#e6edf4" font-size="25">+</text><text x="595" y="548" fill="#ff8d83" font-size="28">1 × 1</text><text x="850" y="548" fill="#a7bacb" font-size="26">=</text><text x="945" y="548" fill="#f8d174" font-size="29">1</text><text x="60" y="602" fill="#e6edf4" font-size="27">y₃ =</text><text x="295" y="602" fill="#71c9ff" font-size="28">1 × 2</text><text x="537" y="602" fill="#e6edf4" font-size="25">+</text><text x="595" y="602" fill="#ff8d83" font-size="28">1 × 1</text><text x="850" y="602" fill="#a7bacb" font-size="26">=</text><text x="945" y="602" fill="#f8d174" font-size="29">3</text><text x="40" y="679" fill="#e6edf4" font-size="23">按列汇总</text><text x="265" y="679" fill="#71c9ff" font-size="25">(2, 0, 2)</text><text x="537" y="679" fill="#e6edf4" font-size="25">+</text><text x="595" y="679" fill="#ff8d83" font-size="25">(0, 1, 1)</text><text x="850" y="679" fill="#e6edf4" font-size="25">=</text><text x="925" y="679" fill="#f8d174" font-size="25">(2, 1, 3)</text><text x="40" y="733" fill="#a7bacb" font-size="22">一行回答“这个输出怎么算”；一列回答“这个输入影响哪些输出、各贡献多少”。</text><text x="40" y="768" fill="#a7bacb" font-size="20">本例第一列的第二个系数是 0，因此 x₁ 对第二个输出的贡献为 0。</text></g></svg>