<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620"><title>QR：扣除已有方向，再保留新的垂直方向</title><desc>在列空间自身的 q1,q2 正交坐标中画出 a1=(sqrt2,0)、a2=(1/sqrt2,sqrt(3/2))。红色竖段是 u2，黄色横段是投影。</desc><rect width="1100" height="620" fill="#101d2b"/><g font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif"><text x="30" y="45" fill="#e6edf4" font-size="29">QR：扣除已有方向，再保留新的垂直方向</text><text x="30" y="90" fill="#a7bacb" font-size="22">此图使用 q₁、q₂ 坐标，保持长度与夹角</text><path d="M110,465 L501.0,465" fill="none" stroke="#71c9ff" stroke-width="3"/><path d="M110,465 L110,131.5" fill="none" stroke="#71c9ff" stroke-width="3"/><text x="500" y="495" fill="#71c9ff" font-size="22">q₁</text><text x="65" y="125" fill="#71c9ff" font-size="22">q₂</text><path d="M110,465 L435.2691193458119,465" fill="none" stroke="#71c9ff" stroke-width="4"/><path d="M110,465 L272.6345596729059,465" fill="none" stroke="#f8d174" stroke-width="6"/><path d="M110,465 L272.6345596729059,183.30867957993456" fill="none" stroke="#e6edf4" stroke-width="3"/><path d="M272.6345596729059,465 L272.6345596729059,183.30867957993456" fill="none" stroke="#ff8d83" stroke-width="4"/><circle cx="435.2691193458119" cy="465" r="6" fill="#f8d174"/><circle cx="272.6345596729059" cy="183.30867957993456" r="6" fill="#e6edf4"/><text x="395" y="445" fill="#f8d174" font-size="22">a₁</text><text x="285" y="165" fill="#e6edf4" font-size="22">a₂</text><text x="285" y="330" fill="#ff8d83" font-size="22">u₂</text><text x="100" y="520" fill="#f8d174" font-size="22">黄色段：a₂ 沿 q₁ 的投影</text><text x="610" y="155" fill="#f8d174" font-size="26">a₁ = √2 q₁</text><text x="610" y="225" fill="#e6edf4" font-size="23">a₂ = (1/√2) q₁ + √(3/2) q₂</text><text x="610" y="310" fill="#71c9ff" font-size="22">Q：把新基 q₁、q₂ 排成列</text><text x="610" y="380" fill="#f8d174" font-size="22">R：把这两份坐标排成列</text><text x="610" y="450" fill="#e6edf4" font-size="22">原列 = 新基 × 坐标，即 M = QR</text><text x="30" y="580" fill="#a7bacb" font-size="22">剩余向量 u₂ 与 q₁ 正交；将 u₂ 除以长度，得到单位向量 q₂。</text></g></svg>